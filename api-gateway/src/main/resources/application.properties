# Ferretería Los Maestros - API Gateway Configuration
# Spring Boot 3.3.x + Java 21 + Spring Cloud Gateway 4.1 (Spring Cloud 2023.0.x)
# OJO: el prefijo válido en esta versión es spring.cloud.gateway.*, NO spring.cloud.gateway.server.*
# (ese namespace solo existe desde Spring Cloud Gateway 4.2 / Spring Cloud 2024.x; con 4.1 se ignora en silencio).

spring.application.name=api-gateway

# JWT - debe coincidir con auth-service
app.jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWZlcnJldGVyaWEtbG9jYWwtb25seS0zMmJ5dGVz}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.audience=${JWT_AUDIENCE:ferreteria-frontend}

# Server
server.port=8080

# Spring Cloud Gateway - CORS global
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origins[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-origins[2]=http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations[/**].max-age=3600

# Routes - Static routes (no Eureka)
# Sin StripPrefix: cada servicio ya expone server.servlet.context-path=/api, así que el path debe llegar intacto.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://product-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**, /api/categories/**, /api/images/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://order-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**, /api/dispatches/**, /api/payments/**

spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=http://user-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/users/**, /api/addresses/**, /api/current-account/**, /api/deposits/**

spring.cloud.gateway.routes[4].id=catalog-service
spring.cloud.gateway.routes[4].uri=http://catalog-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/regions/**, /api/communes/**, /api/coverage/**

spring.cloud.gateway.routes[5].id=cart-service
spring.cloud.gateway.routes[5].uri=http://cart-service:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.routes[6].id=actuator
spring.cloud.gateway.routes[6].uri=http://auth-service:8081
spring.cloud.gateway.routes[6].predicates[0]=Path=/actuator/**

# El contenedor usa forward-by-service-name; no necesita las cabeceras Forwarded
# generadas por Spring Cloud Gateway, y esta opción evita el filtro incompatible
# con la versión Spring Framework del reactor actual.
spring.cloud.gateway.forwarded.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,gatewayroutes,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=INFO
