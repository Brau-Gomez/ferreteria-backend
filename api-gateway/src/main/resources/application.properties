# Ferretería Los Maestros - API Gateway Configuration
# Spring Boot 3.5.x + Java 21 + Spring Cloud Gateway 4.2 (Spring Cloud 2025.0.x)
# El namespace server.webflux pertenece a Spring Cloud Gateway WebFlux 4.2.

spring.application.name=api-gateway

# JWT - debe coincidir con auth-service
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ferreteria-auth}
app.jwt.audience=${JWT_AUDIENCE:ferreteria-frontend}

# Server
server.port=8080

# Spring Cloud Gateway - CORS global
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins[1]=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins[2]=http://127.0.0.1:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins[3]=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers[0]=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers[1]=Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers[2]=Accept
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers[3]=Idempotency-Key
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].max-age=3600

# Routes - Static routes (no Eureka)
# Sin StripPrefix: cada servicio ya expone server.servlet.context-path=/api, así que el path debe llegar intacto.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://product-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**, /api/categories/**, /api/images/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://order-service:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**, /api/dispatches/**, /api/payments/**

spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://user-service:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/users/**, /api/usuarios/**, /api/cuentas-corrientes/**, /api/addresses/**, /api/current-account/**, /api/deposits/**

spring.cloud.gateway.server.webflux.routes[4].id=catalog-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://catalog-service:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/regions/**, /api/communes/**, /api/coverage/**

spring.cloud.gateway.server.webflux.routes[5].id=cart-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://cart-service:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.server.webflux.routes[6].id=actuator
spring.cloud.gateway.server.webflux.routes[6].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/actuator/**

# Actuator
management.endpoints.web.exposure.include=health,info,gatewayroutes,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=INFO
