services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-auth
    environment:
      POSTGRES_DB: ferreteria_auth
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5431:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-product:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-product
    environment:
      POSTGRES_DB: ferreteria_product
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5432:5432"
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-order:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-order
    environment:
      POSTGRES_DB: ferreteria_order
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5433:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-user:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-user
    environment:
      POSTGRES_DB: ferreteria_user
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5437:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-catalog:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-catalog
    environment:
      POSTGRES_DB: ferreteria_catalog
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5435:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-cart:
    image: postgres:16-alpine
    container_name: ferreteria-postgres-cart
    environment:
      POSTGRES_DB: ferreteria_cart
      POSTGRES_USER: ${DB_USER:?DB_USER requerido}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerido}
    ports:
      - "5436:5432"
    volumes:
      - postgres_cart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER requerido}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ferreteria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ferreteria-auth
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SEED_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DB_AUTH_URL: jdbc:postgresql://postgres-auth:5432/ferreteria_auth
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8181:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ferreteria-product
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      DB_PRODUCT_URL: jdbc:postgresql://postgres-product:5432/ferreteria_product
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      CATALOG_SERVICE_URL: http://catalog-service:8085
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET requerido}
    ports:
      - "8182:8082"
    depends_on:
      postgres-product:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ferreteria-order
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      DB_ORDER_URL: jdbc:postgresql://postgres-order:5432/ferreteria_order
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
      PRODUCT_SERVICE_URL: http://product-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8085
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET requerido}
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8183:8083"
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: ferreteria-user
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      APP_SEED_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DB_USER_URL: jdbc:postgresql://postgres-user:5432/ferreteria_user
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET requerido}
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8184:8084"
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: ferreteria-catalog
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      DB_CATALOG_URL: jdbc:postgresql://postgres-catalog:5432/ferreteria_catalog
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER requerido}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS requerido}
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8185:8085"
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: ferreteria-cart
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      DB_CART_URL: jdbc:postgresql://postgres-cart:5432/ferreteria_cart
      DB_USER: ${DB_USER:?DB_USER requerido}
      DB_PASS: ${DB_PASS:?DB_PASS requerido}
      PRODUCT_SERVICE_URL: http://product-service:8082
      JWT_ISSUER_URI: http://auth-service:8081
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8186:8086"
    depends_on:
      postgres-cart:
        condition: service_healthy
      product-service:
        condition: service_started
      auth-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ferreteria-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      JWT_ISSUER: ferreteria-auth
      JWT_AUDIENCE: ferreteria-frontend
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "8180:8080"
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started

volumes:
  postgres_auth_data:
  postgres_product_data:
  postgres_order_data:
  postgres_user_data:
  postgres_catalog_data:
  postgres_cart_data:
  rabbitmq_data:

networks:
  default:
    name: ferreteria-network