name: CI Backend

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    services:
      postgres-auth:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_auth
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5431:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-product:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_product
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-order:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_order
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-user:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_user
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-cart:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ferreteria_cart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        env:
          DB_AUTH_URL: jdbc:postgresql://localhost:5431/ferreteria_auth
          DB_PRODUCT_URL: jdbc:postgresql://localhost:5432/ferreteria_product
          DB_ORDER_URL: jdbc:postgresql://localhost:5433/ferreteria_order
          DB_USER_URL: jdbc:postgresql://localhost:5437/ferreteria_user
          DB_CATALOG_URL: jdbc:postgresql://localhost:5435/ferreteria_catalog
          DB_CART_URL: jdbc:postgresql://localhost:5436/ferreteria_cart
          DB_USER: postgres
          DB_PASS: postgres
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: "5672"
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
          # Secreto SOLO para pruebas de CI (base64, mas de 32 bytes). No es el de produccion.
          JWT_SECRET: ZGV2LXNlY3JldC1rZXktZm9yLWZlcnJldGVyaWEtbG9jYWwtb25seS0zMmJ5dGVz
        run: ./mvnw -B verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: "**/target/surefire-reports/"

  docker-build:
    name: Construir imagen (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - user-service
          - catalog-service
          - cart-service

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Solo verifica que la imagen se construye. No se publica en ningun registro.
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
