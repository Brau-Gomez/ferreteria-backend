spring:
  application:
    name: product-service
  datasource:
    url: ${DB_PRODUCT_URL:jdbc:postgresql://localhost:5432/ferreteria_product}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  cloud:
    stream:
      defaultBinder: rabbit
      bindings:
        productoCreado-out-0:
          destination: producto.creado
          content-type: application/json
        productoActualizado-out-0:
          destination: producto.actualizado
          content-type: application/json
        productoStockActualizado-out-0:
          destination: producto.stock_actualizado
          content-type: application/json
        productoEliminado-out-0:
          destination: producto.eliminado
          content-type: application/json
      rabbit:
        bindings:
          productoCreado-out-0:
            producer:
              exchange-type: topic
              routing-key: producto.creado
          productoActualizado-out-0:
            producer:
              exchange-type: topic
              routing-key: producto.actualizado
          productoStockActualizado-out-0:
            producer:
              exchange-type: topic
              routing-key: producto.stock_actualizado
          productoEliminado-out-0:
            producer:
              exchange-type: topic
              routing-key: producto.eliminado
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC
          catalog-client:
            url: ${CATALOG_SERVICE_URL:http://localhost:8085}
            connectTimeout: 3000
            readTimeout: 3000

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ferreteria.product_service: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    feign: DEBUG

app:
  internal:
    secret: ${INTERNAL_API_SECRET:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}