spring:
  application:
    name: cart-service
  datasource:
    url: ${DB_CART_URL:jdbc:postgresql://localhost:5436/ferreteria_cart}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-interval: 10000
          multiplier: 2
  cloud:
    stream:
      defaultBinder: rabbit
      bindings:
        carritoItemAgregado-out-0:
          destination: carrito.item_agregado
          content-type: application/json
          producer:
            required-groups: cart-service
        carritoItemEliminado-out-0:
          destination: carrito.item_eliminado
          content-type: application/json
          producer:
            required-groups: cart-service
        carritoVaciado-out-0:
          destination: carrito.vaciado
          content-type: application/json
          producer:
            required-groups: cart-service
      rabbit:
        bindings:
          carritoItemAgregado-out-0:
            producer:
              routing-key: carrito.item_agregado
              exchange-type: topic
          carritoItemEliminado-out-0:
            producer:
              routing-key: carrito.item_eliminado
              exchange-type: topic
          carritoVaciado-out-0:
            producer:
              routing-key: carrito.vaciado
              exchange-type: topic

server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /api

cart:
  max-items: ${CART_MAX_ITEMS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /doc/swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
