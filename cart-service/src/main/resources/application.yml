spring:
  application:
    name: cart-service
  datasource:
    url: ${DB_CART_URL:jdbc:postgresql://localhost:5436/ferreteria_cart}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8086}
  servlet:
    context-path: /api

cart:
  max-items: ${CART_MAX_ITEMS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /doc/swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
