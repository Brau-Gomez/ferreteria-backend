# Ferretería Los Maestros - Auth Service Configuration
# Spring Boot 3.3.x + Java 21

spring.application.name=auth-service
spring.profiles.default=dev

# Server
server.port=8081
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_AUTH_URL:jdbc:postgresql://localhost:5431/ferreteria_auth}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.create-schemas=true

# Security - OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.ferreteria.ms_auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN

# JWT Configuration (custom properties)
# JWT_SECRET is supplied by application-dev.properties locally.
# Every non-development profile requires JWT_SECRET (base64, >=32 bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=ferreteria-auth
app.jwt.audience=ferreteria-frontend

# Idempotency
app.idempotency.ttl-hours=24
app.idempotency.cleanup-cron=0 0 3 * * *

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Spring Cloud Stream
spring.cloud.stream.defaultBinder=rabbit
spring.cloud.stream.bindings.authUserLogin-out-0.destination=auth.usuario_login
spring.cloud.stream.bindings.authUserLogin-out-0.content-type=application/json
spring.cloud.stream.bindings.authUserRegistered-out-0.destination=auth.usuario_registrado
spring.cloud.stream.bindings.authUserRegistered-out-0.content-type=application/json
spring.cloud.stream.bindings.authTokenRefreshed-out-0.destination=auth.token_actualizado
spring.cloud.stream.bindings.authTokenRefreshed-out-0.content-type=application/json
spring.cloud.stream.bindings.authUserLogout-out-0.destination=auth.usuario_logout
spring.cloud.stream.bindings.authUserLogout-out-0.content-type=application/json