# Ferretería Los Maestros - Catalog Service Configuration
# Spring Boot 3.3.x + Java 21

spring.application.name=catalog-service
spring.jpa.open-in-view=false

# Server
server.port=8085
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_CATALOG_URL:jdbc:postgresql://localhost:5435/ferreteria_catalog}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.create-schemas=true

# Security - OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Spring Cloud Stream
spring.cloud.stream.defaultBinder=rabbit
spring.cloud.stream.bindings.regionCreada-out-0.destination=region.creada
spring.cloud.stream.bindings.regionCreada-out-0.content-type=application/json
spring.cloud.stream.bindings.regionActualizada-out-0.destination=region.actualizada
spring.cloud.stream.bindings.regionActualizada-out-0.content-type=application/json
spring.cloud.stream.bindings.regionEliminada-out-0.destination=region.eliminada
spring.cloud.stream.bindings.regionEliminada-out-0.content-type=application/json
spring.cloud.stream.bindings.comunaCreada-out-0.destination=comuna.creada
spring.cloud.stream.bindings.comunaCreada-out-0.content-type=application/json
spring.cloud.stream.bindings.comunaActualizada-out-0.destination=comuna.actualizada
spring.cloud.stream.bindings.comunaActualizada-out-0.content-type=application/json
spring.cloud.stream.bindings.comunaEliminada-out-0.destination=comuna.eliminada
spring.cloud.stream.bindings.comunaEliminada-out-0.content-type=application/json
spring.cloud.stream.bindings.coberturaActualizada-out-0.destination=cobertura.actualizada
spring.cloud.stream.bindings.coberturaActualizada-out-0.content-type=application/json
spring.cloud.stream.bindings.coberturaEliminada-out-0.destination=cobertura.eliminada
spring.cloud.stream.bindings.coberturaEliminada-out-0.content-type=application/json
spring.cloud.stream.rabbit.bindings.regionCreada-out-0.producer.exchange-type=topic
spring.cloud.stream.rabbit.bindings.regionCreada-out-0.producer.routing-key=region.creada
spring.cloud.stream.rabbit.bindings.comunaCreada-out-0.producer.exchange-type=topic
spring.cloud.stream.rabbit.bindings.comunaCreada-out-0.producer.routing-key=comuna.creada
spring.cloud.stream.rabbit.bindings.coberturaActualizada-out-0.producer.exchange-type=topic
spring.cloud.stream.rabbit.bindings.coberturaActualizada-out-0.producer.routing-key=cobertura.actualizada

springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.ferreteria.catalog_service=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN